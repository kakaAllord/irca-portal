name: ci

on:
  pull_request:
  push:
    branches: [main, dev-allord]

# The browser journeys (npm run e2e) need the backend and the form checked
# out beside this repository, so they run on a developer's machine, not here.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm test
      - run: npm run build
